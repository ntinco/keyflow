name: health-check

on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HAS_AGENT_CORE: ${{ secrets.AGENT_CORE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s ai/tests -v
      - run: python3 ai/health_check.py
      - run: python3 ai/hotkey_sync.py --check
      # The macOS validators need only Lua, not macOS; Windows validators need AutoHotkey and stay local.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 ai/tests/macos_logic_test.lua
      - run: find platforms/macos -name '*.lua' -exec luac5.4 -p {} +
      # Drift against agent-core: the repository is private, so this needs a read-only token in the AGENT_CORE_TOKEN secret.
      - name: Check out agent-core
        if: env.HAS_AGENT_CORE == 'true'
        uses: actions/checkout@v4
        with:
          repository: ntinco/agent-core
          token: ${{ secrets.AGENT_CORE_TOKEN }}
          path: .ci-agent-core
          persist-credentials: false
      - name: Compare the contract and shared files with agent-core
        if: env.HAS_AGENT_CORE == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/workspace"
          mv .ci-agent-core "$RUNNER_TEMP/workspace/agent-core"
          WORKSPACE_ROOT="$RUNNER_TEMP/workspace" python3 ai/workspace_contract.py
      - name: Report the skipped drift check
        if: env.HAS_AGENT_CORE != 'true'
        run: echo "::notice::AGENT_CORE_TOKEN is not set; the contract and shared files were not compared with agent-core"
